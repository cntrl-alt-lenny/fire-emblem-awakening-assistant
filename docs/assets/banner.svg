<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
<title id="title">Fire Emblem Awakening Assistant</title>
<desc id="desc">An original tactical grid with a gold route and blue unit markers. Know the numbers. Respect the unknowns.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101c30"/><stop offset="1" stop-color="#26384c"/></linearGradient>
  <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse"><path d="M64 0H0V64" fill="none" stroke="#9ab8c9" stroke-opacity=".10"/></pattern>
  <linearGradient id="gold"><stop stop-color="#f6dfa2"/><stop offset="1" stop-color="#bd9650"/></linearGradient>
</defs>
<rect width="1280" height="640" fill="url(#bg)"/>
<rect width="1280" height="640" fill="url(#grid)"/>
