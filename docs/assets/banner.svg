<text x="109" y="395" font-family="Arial, Helvetica, sans-serif" font-size="25" letter-spacing="8" fill="#c1cfda">ASSISTANT</text>
<text x="109" y="499" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#e6e9e8">Know the numbers. Respect the unknowns.</text>
<text x="109" y="542" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#9aafbf">REFERENCE  /  CALCULATE  /  TRACK</text>
