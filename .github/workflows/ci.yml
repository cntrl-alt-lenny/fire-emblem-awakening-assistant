name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Audit (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.9'
          - os: ubuntu-latest
            python: '3.13'
          - os: macos-latest
            python: '3.13'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Validate reference data
        run: python tools/validate_data.py
      - name: Audit difficulty separation
        run: python tools/audit_phase2.py
      - name: Audit Hard tactical records
        run: python tools/audit_hard.py
      - name: Check agent framework hygiene
        run: python tools/fw.py check
      - name: Run regression suite
        run: python -m unittest discover -s tests -v
